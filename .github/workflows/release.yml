name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release archives
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist

          chmod +x shared/setup-prefix.sh
          find apps -type f -name '*.sh' -exec chmod +x {} +

          # Per-app release package: Affinity Photo 2 (2.6.5)
          STAGE_PHOTO="dist/stage-photo"
          mkdir -p "$STAGE_PHOTO/affinity-photo-2-2.6.5/apps/affinity-photo-2"
          cp -a apps/affinity-photo-2/2.6.5 "$STAGE_PHOTO/affinity-photo-2-2.6.5/apps/affinity-photo-2/"
          cp -a shared LICENSE README.md "$STAGE_PHOTO/affinity-photo-2-2.6.5/"
          tar -C "$STAGE_PHOTO" -czf "dist/affinity-photo-2-2.6.5.tar.gz" affinity-photo-2-2.6.5

          # Full repository scripts bundle
          STAGE_ALL="dist/stage-all"
          mkdir -p "$STAGE_ALL/precanva-affinity-linux-${TAG}"
          cp -a apps shared LICENSE README.md "$STAGE_ALL/precanva-affinity-linux-${TAG}/"
          tar -C "$STAGE_ALL" -czf "dist/precanva-affinity-linux-${TAG}.tar.gz" "precanva-affinity-linux-${TAG}"

          rm -rf "$STAGE_PHOTO" "$STAGE_ALL"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
          ls -lh dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
